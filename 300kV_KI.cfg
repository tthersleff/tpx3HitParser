[Defaults]
# Xeon w5-3435X: 16 physical cores, 32 threads. One worker per physical
# core. The writer and orchestrator sit on the hyperthread siblings.
cores = 16
# van Schayck et al., Ultramicroscopy 218 (2020) 113091.
# At 300 keV the highest ToT is the end of the track (least accurate).
# The largest delta-ToA is charge deposited high in the sensor, nearest
# the entrance. CNN is more accurate; it needs a detector-specific model.
algorithm = highest_toa

## Hit parsing
max_hits = 0
# Single 256 x 256 chip: no quad cross and no chip stitching.
hits_remove_cross = False
hits_combine_chips = False
# hits_cross_extra_offset = 2

# Set default ToT threshold
hits_tot_threshold = 5

# ToT correction. The 300 keV sum-ToT window below was measured after
# per-pixel correction. Leave at 0 until a calibration file is available.
# hits_tot_correct_file = /mnt/public/tthersleff/20250915_AdvascopeTests02/300um_300kV_KI.h5
hits_tot_correct_file = 0

# ToA phase correction
hits_toa_phase_correction = 0

## Cluster finding
cluster_chunk_size = 6000
# cluster_chunk_size = 5000000
# Side length of the ToT/ToA crop. Kept clusters have fewer than
# cluster_max_size hits, so a straight line of them fits at
# cluster_max_size - 1. 14 leaves one pixel of margin.
cluster_matrix_size = 14

# 300 keV electron filter from the paper (both limits are exclusive):
# size 4..14, sum ToT 100..525. Neighbours within 3200 fine-ToA ticks.
cluster_time_window = 3200
cluster_min_size = 4
cluster_max_size = 14
cluster_min_sum_tot = 100
cluster_max_sum_tot = 525

# Store cluster_stats
cluster_stats = True

# Sorting is a full extra read/write. load_events_h5 sorts on read.
event_sort_toa = 0

## Output datasets
store_hits = True
store_clusters = False
store_events = True

## Event finding
event_cnn_model = 0
event_cnn_tot_only = False

## ADVS-specific
advs_chunk_size = 5000000
